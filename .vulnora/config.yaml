version: '1.0'
project:
  name: Vulnora.AI
  language: python
  write_permission: prompt
git:
  protected_branches:
  - main
  - master
  - production
  - staging
  enforce_pre_push: true
  block_on_critical: true
  hooks_dir: null
scanners:
  enabled:
  - gitleaks
  - semgrep
  - bandit
  - osv-scanner
  - trivy
  timeout_seconds: 60
  auto_install_missing: false
ai:
  enabled: true
  provider: gemini
  model: gemini-2.5-flash
  endpoint: null
  timeout_seconds: 60
