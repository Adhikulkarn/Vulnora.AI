[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnora"
version = "0.1.0"
description = "Standalone, pure-Python, language-agnostic security CLI & Git engine for self-vaccinating codebases"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Vulnora AI Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "PyYAML>=6.0.1",
    "tree-sitter-language-pack>=0.7.0",
    "textual>=0.75.0",
    "pyperclip>=1.8.2",
    "google-genai>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Aditya-S-0/Vulnora.AI"
Repository = "https://github.com/Aditya-S-0/Vulnora.AI.git"
Issues = "https://github.com/Aditya-S-0/Vulnora.AI/issues"

[project.scripts]
vulnora = "vulnora.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vulnora*"]
exclude = ["tests*", "scratch*", "venv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
